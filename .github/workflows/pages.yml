name: Pubblica il sito su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permessi minimi di default: solo lettura del codice
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Prepara e carica i file del sito
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Azioni bloccate su una versione esatta (commit) per evitare manomissioni
      - name: Scarica il codice
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Blocca la pubblicazione se le impronte "integrity" non corrispondono ai file
      - name: Controlla integrity
        run: python3 tools/aggiorna-integrity.py --check

      # Pubblica solo i file del sito: niente README, workflow, strumenti o altri file del repository
      - name: Prepara i file del sito
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/

      - name: Carica il sito
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # 2) Pubblica su GitHub Pages (job separato: i file caricati sono già disponibili)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configura Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
