name: Pubblica il sito su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permessi minimi di default: solo lettura del codice
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Prepara e carica i file del sito
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Azioni bloccate su una versione esatta (commit) per evitare manomissioni
      - name: Scarica il codice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocca la pubblicazione se le impronte "integrity" non corrispondono ai file
      - name: Controlla integrity
        run: python3 tools/aggiorna-integrity.py --check

      # Pubblica solo i file del sito e la bozza OPA: niente README, workflow o strumenti
      - name: Prepara i file del sito
        run: |
          mkdir -p _site
          cp index.html privacy.html _site/
          cp -r assets _site/
          # bozza dimostrativa per OPA Greek Gyros (pagina con noindex)
          mkdir -p _site/bozze
          cp -r bozze/opa-greek-gyros _site/bozze/

      - name: Carica il sito
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # 2) Pubblica su GitHub Pages (job separato: i file caricati sono già disponibili)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configura Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
